# docker-compose.yml
version: "3.8"
services:
   frontend:
     build:
       context: .
       dockerfile: Dockerfile
     # link current directory to working directory in image
     volumes:
       - ./:/app:delegated
       - /node_modules
     ports:
       - 3000:3000
     environment:
       - CHOKIDAR_USEPOLLING=true